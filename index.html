<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FED Chatbot</title>
    <!-- FontAwesome is still good to pull from CDN or we could install it, but keeping it simple as per original -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="h-screen w-full flex items-center justify-center bg-gray-100">

    <!-- Main Container -->
    <div
        class="relative w-full h-full max-w-md mx-auto bg-white sm:h-[600px] sm:rounded-2xl sm:shadow-2xl overflow-hidden flex flex-col border border-gray-200">

        <!-- Header -->
        <div class="bg-gray-900 text-white p-4 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-pink-500 rounded-full flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-robot text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">FED Chatbot</h1>
                </div>
            </div>
            <!-- Settings button removed as per user request -->
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="max-w-[85%] bg-white border border-gray-200 rounded-2xl rounded-tl-none p-3 shadow-sm">
                    <p class="text-sm text-gray-800">Hello! I'm <strong>FED Chatbot</strong>, your personal
                        assistant for
                        FED KIIT. 🚀<br><br>Ask me about our team, upcoming events, or how to join the society!</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-100">
            <form id="chat-form" class="flex items-center space-x-2">
                <input type="text" id="user-input" placeholder="Ask about events, team, roles..."
                    class="flex-1 bg-gray-100 text-gray-800 text-sm rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 transition placeholder-gray-400"
                    autocomplete="off">
                <button type="submit" id="send-btn"
                    class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center text-white hover:bg-orange-600 transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
